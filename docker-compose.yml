version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: mymoney_postgres
    restart: always
    environment:
      POSTGRES_USER: mymoney_user
      POSTGRES_PASSWORD: mymoney_password
      POSTGRES_DB: mymoney_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: