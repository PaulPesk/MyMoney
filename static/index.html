<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyMoney - Financial Dashboard</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans min-h-screen">

    <!-- Navbar -->
    <nav class="bg-indigo-600 text-white p-4 shadow-md flex justify-between items-center">
        <h1 class="text-2xl font-bold">💰 MyMoney</h1>
        <div id="userInfo" class="hidden flex items-center space-x-4">
            <span id="userEmail" class="font-medium"></span>
            <button onclick="logout()" class="bg-red-500 hover:bg-red-600 px-3 py-1 rounded text-sm transition font-medium">Logout</button>
        </div>
    </nav>

    <div class="container mx-auto p-6 max-w-5xl">

        <!-- Auth Section (Login / Register) -->
        <div id="authSection" class="max-w-md mx-auto bg-white p-8 rounded-xl shadow-md mt-10">
            <h2 id="authTitle" class="text-2xl font-bold mb-6 text-center text-gray-800">Sign In</h2>
            <form id="authForm" onsubmit="handleAuth(event)" class="space-y-4">
                <div>
                    <label class="block text-gray-700 font-medium mb-1">Email Address</label>
                    <input type="email" id="authEmail" required class="w-full p-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none" placeholder="you@example.com">
                </div>
                <div>
                    <label class="block text-gray-700 font-medium mb-1">Password</label>
                    <input type="password" id="authPassword" required class="w-full p-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none" placeholder="••••••••">
                </div>
                <button type="submit" id="authSubmitBtn" class="w-full bg-indigo-600 text-white py-2 rounded-lg hover:bg-indigo-700 transition font-semibold">Sign In</button>
            </form>
            <p class="text-center text-sm text-gray-600 mt-4">
                <span id="authToggleText">Don't have an account?</span>
                <button onclick="toggleAuthMode()" id="authToggleBtn" class="text-indigo-600 font-semibold underline ml-1">Register</button>
            </p>
        </div>

        <!-- Dashboard Section (Hidden by default) -->
        <div id="dashboardSection" class="hidden space-y-6">

            <!-- Date Filter Section -->
            <div class="bg-white p-4 rounded-xl shadow-sm flex flex-wrap items-center justify-between gap-4">
                <div class="flex items-center space-x-2">
                    <span class="text-gray-700 font-semibold text-sm">📅 Date Range Filter:</span>
                </div>
                <div class="flex flex-wrap items-center gap-3">
                    <div>
                        <label class="text-xs text-gray-500 mr-1">From:</label>
                        <input type="date" id="filterStartDate" class="p-2 border rounded-lg text-sm outline-none focus:ring-2 focus:ring-indigo-500">
                    </div>
                    <div>
                        <label class="text-xs text-gray-500 mr-1">To:</label>
                        <input type="date" id="filterEndDate" class="p-2 border rounded-lg text-sm outline-none focus:ring-2 focus:ring-indigo-500">
                    </div>
                    <button onclick="loadAnalytics()" class="bg-indigo-600 text-white px-4 py-2 rounded-lg hover:bg-indigo-700 transition text-sm font-semibold">
                        Apply Filter
                    </button>
                    <button onclick="clearDateFilter()" class="bg-gray-200 text-gray-700 px-3 py-2 rounded-lg hover:bg-gray-300 transition text-sm font-semibold">
                        Clear
                    </button>
                </div>
            </div>

            <!-- Summary Cards -->
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                <div class="bg-white p-6 rounded-xl shadow-sm border-l-4 border-green-500">
                    <h3 class="text-gray-500 text-sm font-semibold uppercase tracking-wider">Total Income</h3>
                    <p id="totalIncome" class="text-2xl font-bold text-green-600 mt-1">€0.00</p>
                </div>
                <div class="bg-white p-6 rounded-xl shadow-sm border-l-4 border-red-500">
                    <h3 class="text-gray-500 text-sm font-semibold uppercase tracking-wider">Total Expenses</h3>
                    <p id="totalExpenses" class="text-2xl font-bold text-red-600 mt-1">€0.00</p>
                </div>
                <div class="bg-white p-6 rounded-xl shadow-sm border-l-4 border-indigo-500">
                    <h3 class="text-gray-500 text-sm font-semibold uppercase tracking-wider">Net Balance</h3>
                    <p id="netBalance" class="text-2xl font-bold text-indigo-600 mt-1">€0.00</p>
                </div>
            </div>

            <!-- New Transaction Form & Category Analytics -->
            <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
                
                <!-- Add Transaction Form -->
                <div class="bg-white p-6 rounded-xl shadow-sm">
                    <h3 class="text-lg font-bold mb-4 text-gray-800">New Transaction</h3>
                    <form id="transactionForm" onsubmit="createTransaction(event)" class="space-y-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Amount (€)</label>
                            <input type="number" step="0.01" id="txAmount" placeholder="0.00" required class="w-full p-2 border rounded-lg outline-none focus:ring-2 focus:ring-indigo-500">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Type</label>
                            <select id="txType" class="w-full p-2 border rounded-lg outline-none focus:ring-2 focus:ring-indigo-500">
                                <option value="EXPENSE">Expense</option>
                                <option value="INCOME">Income</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Category</label>
                            <input type="text" id="txCategory" placeholder="e.g. Groceries, Salary, Utilities" required class="w-full p-2 border rounded-lg outline-none focus:ring-2 focus:ring-indigo-500">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Date</label>
                            <input type="date" id="txDate" class="w-full p-2 border rounded-lg outline-none focus:ring-2 focus:ring-indigo-500">
                        </div>
                        <button type="submit" class="w-full bg-green-600 text-white py-2 rounded-lg hover:bg-green-700 transition font-semibold">Add Transaction</button>
                    </form>
                </div>

                <!-- Expenses Breakdown List -->
                <div class="bg-white p-6 rounded-xl shadow-sm flex flex-col justify-between">
                    <h3 class="text-lg font-bold mb-4 text-gray-800">Expenses Breakdown</h3>

                    <ul id="categoriesList" class="space-y-2 divide-y divide-gray-100 max-h-64 overflow-y-auto">
                        <li class="text-gray-500 text-sm italic py-2 text-center">No expenses found...</li>
                    </ul>
                </div>

            </div>

            <!-- Transactions List Table -->
            <div class="bg-white p-6 rounded-xl shadow-sm">
                <h3 class="text-lg font-bold mb-4 text-gray-800">Recent Transactions</h3>
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="bg-gray-50 border-b text-gray-600 text-sm">
                                <th class="p-3">Type</th>
                                <th class="p-3">Category</th>
                                <th class="p-3">Date</th>
                                <th class="p-3">Amount</th>
                                <th class="p-3 text-right">Action</th>
                            </tr>
                        </thead>
                        <tbody id="transactionsTable" class="divide-y divide-gray-100">
                            <!-- Transactions rendered dynamically via app.js -->
                        </tbody>
                    </table>
                </div>
            </div>

        </div>

    </div>

    <script src="/static/app.js?v=4"></script>
</body>
</html>
